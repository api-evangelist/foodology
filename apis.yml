name: Foodology
description: >-
  Foodology is a Bogota-based food-tech company building what it calls the largest
  group of delivery-focused virtual restaurant brands in Latin America. Founded in 2019
  by Daniela Izquierdo and Juan Guillermo Azuero, it operates a cloud-kitchen (ghost
  kitchen) model, creating restaurant brands from scratch and running them out of shared
  commissaries and kitchens so multiple brands share real estate, ingredients, and staff.
  Marquee brands include Brunch & Munch (the #1 breakfast delivery brand in Colombia) and
  Avocalia (a leading salad brand). Foodology runs more than 85 cloud kitchens across
  Colombia, Mexico, Brazil, and Peru and reports over 300,000 delivered orders per month.
  It is backed by Andreessen Horowitz (a16z), Base10/Base Partners, Wollef, Kayyak,
  Chimera, and artist Maluma, having raised a $15M Series A and a later $50M round. This
  profile was surfaced as an a16z portfolio company and added to the API Evangelist network;
  Foodology is a consumer food-delivery operator and does not publish a public developer
  API, SDKs, or developer portal.
